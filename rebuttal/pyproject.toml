[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "qwen-rebuttal"
version = "0.1.0"
description = "Clean, reproducible Qwen3.5 source/user rebuttal experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate==1.12.0",
  "huggingface-hub==1.10.0",
  "matplotlib==3.10.7",
  "numpy==2.3.5",
  "pandas==2.3.3",
  "pyarrow==22.0.0",
  "scipy==1.16.3",
  "torch==2.9.1",
  "tqdm==4.67.1",
  "transformers @ git+https://github.com/huggingface/transformers.git@83c3672b706b47061c0fb56a10ae8a451ae35506",
]

[project.optional-dependencies]
gpu = [
  "causal-conv1d==1.6.1; sys_platform == 'linux'",
  "flash-attn==2.8.3; sys_platform == 'linux'",
  "flash-linear-attention==0.5.0; sys_platform == 'linux'",
  "ninja==1.13.0; sys_platform == 'linux'",
  "packaging==25.0; sys_platform == 'linux'",
  "psutil==7.1.3; sys_platform == 'linux'",
  "setuptools==80.9.0; sys_platform == 'linux'",
  "wheel==0.45.1; sys_platform == 'linux'",
]
test = [
  "pytest==9.0.1",
  "ruff==0.14.8",
]

[project.scripts]
qwen-rebuttal = "qwen_rebuttal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_rebuttal"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
no-build-isolation-package = ["flash-attn", "flash-linear-attention", "causal-conv1d"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
