seed: 42
dataset:
  raw_path: data/answer.jsonl
  split_a_path: data/split_A_user_wrong.jsonl
  split_b_path: data/split_B_user_wrong.jsonl
  split_c_path: data/split_C_user_wrong.jsonl
model:
  name: meta-llama/Llama-3.1-8B-Instruct
  device: auto
  dtype: auto
path_patching:
  max_examples: 120
  layer_start: 0
  layer_end: null
  patch_positions: [prompt_last, first_answer]
output:
  raw_results: llama-results/head_patching/head_results_raw.jsonl
  head_scores: llama-results/head_patching/head_scores.jsonl
  syc_heads: llama-results/head_patching/syc_heads.json
  rand_heads: llama-results/head_patching/rand_heads.json
  summary: llama-results/head_patching/head_summary.json
head_selection:
  coverage_fraction: 0.75
  fallback_top_k: 20
  # Selection modes: positive_coverage | top_k_per_layer | global_top_k_abs | abs_top_k_per_layer
  selection_mode: abs_top_k_per_layer
  # Ranking metric: delta_sum | delta_mean | abs_delta_sum
  rank_metric: delta_sum
  # For global_top_k_abs mode
  top_k: 20
  # For top_k_per_layer / abs_top_k_per_layer modes
  top_k_per_layer: 2
  # Filter rows to a specific patch position label (e.g., prompt_last, first_answer); null = all
  pos_label: null
  # If true, don't filter on delta_sum > 0
  bypass_positive_filter: false
  # Whether to write exploratory_heads.json (top 2 per layer by abs effect)
  emit_exploratory_set: true
  exploratory_top_k_per_layer: 2
