seed: 42
dataset:
  raw_path: data/answer.jsonl
  split_a_path: data/split_A_user_wrong.jsonl
  split_b_path: data/split_B_user_wrong.jsonl
  split_c_path: data/split_C_user_wrong.jsonl
model:
  name: meta-llama/Llama-3.1-8B-Instruct
  device: auto
  dtype: auto
exp3:
  max_examples: 128
  delta_E_mode: relative
  delta_E_threshold: 0.5   # only used if delta_E_mode == absolute
  delta_E_multiplier: 0.25
  delta_E_min: 0.05
  output_dir: results/causal_mediation
  head_means_reference_split: data/split_B_user_wrong.jsonl
  head_means_max_examples: 128
  layer_vectors_path: llama-results/caa_vectors/layer_vectors.pt
  vector_selection_path: llama-results/caa_vectors/vector_selection.json
  syc_heads_path: llama-results/head_patching/syc_heads.json
  rand_heads_path: llama-results/head_patching/rand_heads.json
  exploratory_heads_path: llama-results/head_patching/exploratory_heads.json
  # Set to true to use exploratory_heads instead of syc_heads for mediation
  use_exploratory_heads: false
