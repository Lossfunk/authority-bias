seed: 42

model:
  name: meta-llama/Llama-3.1-8B-Instruct
  device: auto
  dtype: auto

dataset:
  test_path: data/split_C_user_wrong.jsonl

steering_vector:
  vectors_path: llama-results/exp1/layer_vectors.pt
