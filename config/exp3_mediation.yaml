seed: 42
dataset:
  raw_path: data/answer.jsonl
  split_a_path: data/split_A_user_wrong.jsonl
  split_b_path: data/split_B_user_wrong.jsonl
  split_c_path: data/split_C_user_wrong.jsonl
model:
  name: TinyLlama/TinyLlama-1.1B-Chat-v1.0
  device: auto
  dtype: auto
exp3:
  max_examples: 128
  delta_E_mode: relative
  delta_E_threshold: 0.5   # only used if delta_E_mode == absolute
  delta_E_multiplier: 0.25
  delta_E_min: 0.05
  output_dir: updated-results/exp3
  head_means_reference_split: data/split_B_user_wrong.jsonl
  head_means_max_examples: 128
  layer_vectors_path: updated-results/exp1/layer_vectors.pt
  vector_selection_path: updated-results/exp1/vector_selection.json
  syc_heads_path: updated-results/exp2/syc_heads.json
  rand_heads_path: updated-results/exp2/rand_heads.json
  exploratory_heads_path: updated-results/exp2/exploratory_heads.json
  # Set to true to use exploratory_heads instead of syc_heads for mediation
  use_exploratory_heads: true
